# Local development stack (TASK-001, DEC-005). Settings come from .env (copy example.env).
#   Full stack:             docker compose up --build      then open http://127.0.0.1:8080
#   npm-based development:  docker compose up -d postgres   then npm run dev -w api and npm run dev
#   Development account:    docker compose exec api node dist/seed/seed-cli.js
name: cawb

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/.
      - pgdata:/var/lib/postgresql
      # Creates the "<POSTGRES_DB>_test" database for API tests on first start.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Local stack: development mode (plain HTTP, seed allowed when ALLOW_DEV_SEED=true).
      NODE_ENV: development
      APP_ORIGIN: http://127.0.0.1:${WEB_PORT:-8080}
      COOKIE_SECURE: "false"
      ALLOW_DEV_SEED: ${ALLOW_DEV_SEED:-false}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-}
      # Development demo model (TASK-003 DEC-001); refused when NODE_ENV=production.
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-demo}
    # Not published to the host: the browser reaches the API only through the web container.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
